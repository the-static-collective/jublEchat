name: Apply server-role RPC grants

on:
  push:
    branches:
      - fix/ledger-witness-parity
    paths:
      - .github/workflows/apply-service-role-grants.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/ledger-witness-parity
          fetch-depth: 0

      - name: Add explicit service-role grants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260813193000_012_witness_parity_and_still_alive.sql')
          sql = path.read_text()
          if 'TO service_role;' in sql:
              raise RuntimeError('service-role grants already present; refusing duplicate patch')

          sql += '''

-- These RPCs are server-only. Client roles were revoked above; grant the
-- server-side Supabase role explicitly instead of relying on project defaults.
GRANT EXECUTE ON FUNCTION public.harvest_proposal_v3(
  UUID, UUID, UUID, UUID, TIMESTAMPTZ, INTEGER,
  TEXT, TEXT, TEXT, UUID, TEXT, TEXT, TEXT, TEXT, TEXT,
  JSONB, JSONB, JSONB
) TO service_role;

GRANT EXECUTE ON FUNCTION public.abandon_path_v2(
  UUID, UUID, TEXT, TEXT, TEXT, TEXT, TEXT, UUID, TIMESTAMPTZ
) TO service_role;
'''
          path.write_text(sql)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Ledger contracts
        run: npm run test:ledger

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-service-role-grants.yml

      - name: Commit verified database boundary
        run: |
          git config user.name "the static collective"
          git config user.email "joyvolcanomusic@gmail.com"
          git add supabase/migrations/20260813193000_012_witness_parity_and_still_alive.sql
          git commit -m "fix: grant witness RPCs only to server role"
          git push origin HEAD:fix/ledger-witness-parity
