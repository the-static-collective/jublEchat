name: Apply monotonic ledger review fix

on:
  push:
    branches:
      - fix/ledger-witness-parity
    paths:
      - .github/workflows/apply-monotonic-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/ledger-witness-parity
          fetch-depth: 0

      - name: Apply bounded review patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one exact match, found {count}")
              return text.replace(old, new, 1)

          server_path = Path('server.ts')
          source = server_path.read_text()
          source = replace_once(
              source,
              '''import {
            buildBranchDispositionPayload,
            buildHarvestAcceptedPayload,
          } from "./src/lib/authoritative-events";''',
              '''import {
            buildBranchDispositionPayload,
            buildHarvestAcceptedPayload,
            nextAuthoritativeEventTimestamp,
          } from "./src/lib/authoritative-events";''',
              'authoritative event import',
          )

          harvest_marker = '  // Secure Server-side Harvest API (Evolve Idea, handles multiple mutations as an atomic database transaction)\n'
          abandon_marker = '  // Dedicated Command Endpoint: Authoritatively declare sibling path abandoned\n'
          chat_marker = '  // API endpoint for chat\n'
          pre, rest = source.split(harvest_marker, 1)
          harvest, rest = rest.split(abandon_marker, 1)
          abandon, post = rest.split(chat_marker, 1)

          for name, section in [('harvest', harvest), ('abandon', abandon)]:
              section = replace_once(
                  section,
                  "      let lastHash = 'GENESIS_ANCHOR_v0.2';\n",
                  "      let lastHash = 'GENESIS_ANCHOR_v0.2';\n      let latestEventCreatedAt: string | null = null;\n",
                  f'{name} latest timestamp state',
              )
              section = replace_once(
                  section,
                  "        .order('created_at', { ascending: false })\n        .limit(1);",
                  "        .order('created_at', { ascending: false })\n        .order('id', { ascending: false })\n        .limit(1);",
                  f'{name} head ordering',
              )
              section = replace_once(
                  section,
                  "        const latestEvent = latestEvents[0];\n",
                  "        const latestEvent = latestEvents[0];\n        latestEventCreatedAt = latestEvent.created_at ?? null;\n",
                  f'{name} observed head timestamp',
              )
              section = replace_once(
                  section,
                  "      const eventCreatedAt = new Date().toISOString();\n",
                  "      const eventCreatedAt = nextAuthoritativeEventTimestamp(latestEventCreatedAt);\n",
                  f'{name} monotonic event timestamp',
              )
              if name == 'harvest':
                  harvest = section
              else:
                  abandon = section

          server_path.write_text(pre + harvest_marker + harvest + abandon_marker + abandon + chat_marker + post)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Ledger contracts
        run: npm run test:ledger

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-monotonic-review-fix.yml

      - name: Commit verified review fix
        run: |
          git config user.name "the static collective"
          git config user.email "joyvolcanomusic@gmail.com"
          git add server.ts
          git commit -m "fix: preserve ledger ordering at timestamp ties"
          git push origin HEAD:fix/ledger-witness-parity
