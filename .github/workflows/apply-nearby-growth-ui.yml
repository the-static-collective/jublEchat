name: Apply Nearby Growth UI patch

on:
  push:
    branches:
      - agent/nearby-growth-v0
    paths:
      - .github/workflows/apply-nearby-growth-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/nearby-growth-v0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Apply exact UI patch
        run: node scripts/apply-nearby-growth-ui.cjs

      - name: Verify full bounded slice
        run: |
          npm run test:nearby-growth
          npm run test:ledger
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit only the verified App integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          test "$(git diff --cached --name-only)" = "src/App.tsx"
          git diff --cached --check
          git commit -m "feat: show evidenced Nearby Growth"
          git push origin HEAD:agent/nearby-growth-v0
