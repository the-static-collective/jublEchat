name: Baseline typecheck witness

on:
  push:
    branches:
      - fix/ledger-witness-parity
    paths:
      - .github/workflows/baseline-typecheck.yml

permissions:
  contents: read

jobs:
  main-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck main
        run: npm run typecheck
