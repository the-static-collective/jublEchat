name: Baseline verification witness

on:
  push:
    branches:
      - fix/ledger-witness-parity
    paths:
      - .github/workflows/baseline-typecheck.yml

permissions:
  contents: read

jobs:
  main-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck main
        continue-on-error: true
        run: npm run typecheck

      - name: Lint main
        continue-on-error: true
        run: npm run lint

      - name: Build main
        run: npm run build
